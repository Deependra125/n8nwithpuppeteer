steps:
  # Step 1: Build the Docker image using the UI variables
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}', 
      '.'
    ]

  # Step 2: Push the image to your Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push', 
      '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'
    ]

  # Step 3: Deploy to Cloud Run with Chromium optimization flags
  - name: 'gcr.io/://google.com'
    entrypoint: gcloud
    args: [
      'run', 'deploy', '${_SERVICE_NAME}',
      '--image', '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}',
      '--region', '${_DEPLOY_REGION}',
      '--platform', '${_PLATFORM}',
      '--port', '3030',
      '--cpu', '2',
      '--memory', '2Gi',
      '--allow-unauthenticated'
    ]

serviceAccount: 'leadscrapper@team-enoch-invoice-management.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY
