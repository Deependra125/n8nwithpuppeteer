# cloudbuild.yaml
steps:
  # Step 1: Compile the local repository using your updated Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/n8n-puppeteer-bridge:$COMMIT_SHA', '.']

  # Step 2: Push the built container layer image up to your image registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/n8n-puppeteer-bridge:$COMMIT_SHA']

  # Step 3: Deploy to Cloud Run using the official gcloud step builder
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'n8n-puppeteer-bridge'
      - '--image=gcr.io/$PROJECT_ID/n8n-puppeteer-bridge:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--ingress=all'
      - '--memory=2Gi'

  # 🔥 FIX Step 4: Force the build pipeline to grant unauthenticated public access automatically
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'services'
      - 'add-iam-policy-binding'
      - 'n8n-puppeteer-bridge'
      - '--region=us-central1'
      - '--member=allUsers'
      - '--role=roles/run.invoker'

images:
  - 'gcr.io/$PROJECT_ID/n8n-puppeteer-bridge:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
